<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grammar Dost</title><meta name="theme-color" content="#482078"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--p:#482078;--dp:#321052;--g:#159447;--lg:#E8F5E9;--bur:#800020;--gold:#E5B34B;--bg:#F7F8FC;--w:#fff;--tx:#202033;--t2:#707080;--sh:0 6px 20px #48207824;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14101F;--w:#221A35;--tx:#ECE9F5;--t2:#A9A3BD;--lg:#12351F}:root:not([data-theme=light]) .pt,:root:not([data-theme=light]) .sc label,:root:not([data-theme=light]) .back{color:#D8C4F5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
.ur{font-family:"Noto Nastaliq Urdu","Noto Sans Arabic","Jameel Noori Nastaleeq",serif;direction:rtl;line-height:2.1;text-align:right;unicode-bidi:plaintext}
main{max-width:560px;margin:0 auto;padding:14px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(10px)}}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top>div:nth-child(2){flex:1;line-height:1.25}.top small{display:block;color:var(--t2);font-size:13px}.crest{width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:var(--sh);object-fit:contain}.logo svg{width:44px;height:44px;display:block}
.hero{background:linear-gradient(135deg,var(--p),var(--dp));color:#fff;border-radius:28px;padding:20px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--g);opacity:.35}.hero small{color:var(--gold);font-weight:700}.hero h1{font-size:20px;margin:4px 0 12px;line-height:1.3}.hart{width:112px;flex:none;animation:fl 3s ease-in-out infinite;z-index:1}@keyframes fl{50%{transform:translateY(-6px)}}
.btn{background:var(--g);color:#fff;border:0;border-radius:999px;padding:13px 22px;font-weight:700;min-height:48px;width:100%;margin-top:10px;box-shadow:0 4px 12px #15944740;transition:transform .15s}.btn:active{transform:scale(.97)}.hero .btn{width:auto;margin:0;z-index:1;position:relative}.btn.alt{background:var(--lg);color:var(--g);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stats>div{background:var(--w);border-radius:20px;padding:8px 2px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88px}.stats b{font-size:20px;color:var(--p)}.stats span{font-size:12px;color:var(--t2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tl{background:var(--w);border:0;border-radius:22px;padding:14px;text-align:left;box-shadow:var(--sh);min-height:112px;transition:transform .15s}.tl:active{transform:scale(.97)}.tl i{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:22px;font-style:normal;margin-bottom:8px}.tl b{display:block}.tl span{font-size:12px;color:var(--t2)}
.pt{margin:6px 0 12px;font-size:24px;color:var(--p)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}.tabs button{flex:none;border:0;background:var(--w);border-radius:999px;padding:9px 16px;box-shadow:0 2px 8px #0001;color:var(--t2)}.tabs .on{background:var(--p);color:#fff}
.lc{display:flex;align-items:center;gap:12px;background:var(--w);border-radius:22px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}.ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none}.lb{flex:1;min-width:0}.lb b{display:block}.lb .ur{font-size:15px;line-height:1.8}.go{background:var(--p);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;min-height:44px}
.bar{height:8px;border-radius:9px;background:#e5e7f0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#4ADE80);border-radius:9px;transition:width .5s}.bar.big{height:14px;flex:1}
.back{background:0;border:0;color:var(--p);font-weight:700;padding:6px 0}
.lh{color:#fff;border-radius:26px;padding:20px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;box-shadow:var(--sh)}.lh h1{margin:2px 0;font-size:26px}.lh small{opacity:.85}.lh .ur{font-size:20px;display:block}.big{font-size:58px}
.sc,.ex{background:var(--w);border-radius:22px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--sh)}.sc label{display:block;font-weight:800;font-size:13px;letter-spacing:.04em;margin-bottom:4px;color:var(--p)}.def{border-left:6px solid var(--p)}.urc{border-right:6px solid var(--g);background:var(--lg)}.urc label{color:var(--g)!important;text-align:right}.rul{border-left:6px solid var(--gold)}.mis{border-left:6px solid var(--bur)}.mis label{color:var(--bur)!important}.ex{border-left:6px solid var(--g)}.note{margin:4px 0 0;color:var(--t2)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row p{margin:0}
mark{background:#FFF3CD;color:#321052;border-radius:6px;padding:0 4px;font-weight:700}
.sp{background:var(--lg);border:0;border-radius:50%;width:44px;height:44px;font-size:20px;flex:none}
.qt{display:flex;align-items:center;gap:12px}.x{border:0;background:var(--w);border-radius:50%;width:40px;height:40px;box-shadow:var(--sh)}.qn{color:var(--t2);margin:10px 0 6px;font-weight:600}.qc{background:linear-gradient(135deg,var(--p),var(--dp));color:#fff;border-radius:24px;padding:20px;font-size:19px;font-weight:700;margin-bottom:12px;box-shadow:var(--sh)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--w);border:2px solid transparent;border-radius:18px;padding:12px;margin:10px 0;box-shadow:var(--sh);min-height:56px}.opt i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--bg);font-style:normal;font-weight:800;color:var(--p);flex:none}.opt.ok{border-color:var(--g);background:var(--lg);animation:pop .4s}.opt.ok i{background:var(--g);color:#fff}.opt.no{border-color:#DC2626;background:#FEE2E2;color:#7F1D1D;animation:sh .4s}@keyframes pop{50%{transform:scale(1.04)}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:20px;padding:14px;margin-top:6px;animation:in .3s}.fb.g{background:var(--lg)}.fb.b{background:#FEE2E2;color:#7F1D1D}.fb p{margin:4px 0}
.res{text-align:center;background:var(--w);border-radius:28px;padding:22px;box-shadow:var(--sh);margin-bottom:12px}.stars{font-size:34px;letter-spacing:6px}.res h2{margin:8px 0}
.bds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.bd{background:var(--w);border-radius:20px;padding:12px 4px;text-align:center;box-shadow:var(--sh);filter:grayscale(1);opacity:.55;font-size:12px}.bd div{font-size:30px}.bd.on{filter:none;opacity:1;background:linear-gradient(160deg,#fff,#FFF3CD);color:#321052;border:2px solid var(--gold)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 20px));background:var(--w);border-radius:26px;display:flex;padding:6px;box-shadow:0 8px 30px #32105244;z-index:5}nav button{flex:1;border:0;background:0;color:var(--t2);font-size:11px;padding:6px 0;border-radius:20px;min-height:54px}nav button span{display:block;font-size:22px}nav .on{background:var(--p);color:#fff;font-weight:700}
.msg{background:#FFF3CD;color:#5B4300;border-radius:14px;padding:10px;font-size:14px;margin:10px 0}input{width:100%;border:2px solid #e5e7f0;border-radius:14px;padding:12px;font:inherit;background:var(--bg);color:var(--tx)}.ft{text-align:center;font-size:12px;color:var(--t2);margin-top:16px}
#sp{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#6B2FB0,var(--dp) 70%);color:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;transition:opacity .5s,visibility .5s}#sp img.s{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#sp.out{opacity:0;visibility:hidden}#sp>*{animation:in .8s both}#sp .c{width:110px;height:110px;border-radius:50%;background:#fff;padding:3px;object-fit:contain;box-shadow:0 0 0 4px var(--gold)}#sp h1{letter-spacing:.12em;margin:8px 0 0;font-size:28px}#sp p{margin:0}#sp small{color:var(--gold)}#sp .lgx svg{width:64px;height:64px;animation:fl 3s infinite}#sp .ur{text-align:center}
</style></head><body>
<div id="sp"></div><main id="m"></main><nav id="nav"></nav>
<script>
var L=[
{id:'noun',t:'Noun',u:'اسم',e:'🏠',def:'A noun is the name of a person, place, animal, or thing.',ur:'Noun کسی شخص، جگہ، جانور یا چیز کے نام کو کہتے ہیں۔',
ex:[['Ali is a <mark>student</mark>.','علی ایک طالب علم ہے۔'],['<mark>Karachi</mark> is a big <mark>city</mark>.','کراچی ایک بڑا شہر ہے۔'],['The <mark>cow</mark> gives us <mark>milk</mark>.','گائے ہمیں دودھ دیتی ہے۔'],['This is a <mark>book</mark>.','یہ ایک کتاب ہے۔']],
rule:'Names of people and places start with a capital letter (Ali, Karachi).',mis:'✗ i live in karachi. ✓ I live in Karachi.',
q:[['Which word is a noun? "The boy is tall."',['boy','is','tall','the'],0,'Boy names a person.'],['Which is a proper noun?',['city','Badin','girl','river'],1,'Badin is the name of a particular place.'],['"Milk" is the name of a…',['person','place','thing','action'],2,'Milk is a thing.']]},
{id:'pronoun',t:'Pronoun',u:'ضمیر',e:'👤',def:'A pronoun is a word used in place of a noun.',ur:'Pronoun وہ لفظ ہے جو اسم کی جگہ استعمال ہوتا ہے، جیسے he، she، it۔',
ex:[['Sara is kind. <mark>She</mark> helps everyone.','سارہ مہربان ہے۔ وہ سب کی مدد کرتی ہے۔'],['<mark>We</mark> go to school.','ہم اسکول جاتے ہیں۔'],['The book is mine. Give <mark>it</mark> to <mark>me</mark>.','کتاب میری ہے۔ وہ مجھے دو۔']],
rule:'Use he for a boy, she for a girl, it for things, they for many.',mis:'✗ Me is happy. ✓ I am happy.',
q:[['"Ali is late. ___ missed the bus." Choose the pronoun.',['He','Ali','Bus','Late'],0,'He replaces Ali.'],['Which is a pronoun?',['table','they','run','red'],1,'They stands for people.'],['Replace "Sara and I": ___ are friends.',['We','They','He','It'],0,'We includes the speaker.']]},
{id:'verb',t:'Verb',u:'فعل',e:'🏃',def:'A verb is a word that shows an action or state.',ur:'Verb وہ لفظ ہے جو کام کرنا یا حالت ظاہر کرے۔',
ex:[['The farmer <mark>works</mark> in the field.','کسان کھیت میں کام کرتا ہے۔'],['Children <mark>run</mark> fast.','بچے تیز دوڑتے ہیں۔'],['She <mark>is</mark> happy.','وہ خوش ہے۔']],
rule:'With he/she/it, add s to the verb in present tense (He plays).',mis:'✗ He play cricket. ✓ He plays cricket.',
q:[['Find the verb: "Birds fly high."',['Birds','fly','high','none'],1,'Fly is the action.'],['She ___ a letter every day.',['write','writes','writing','wrote'],1,'She takes writes.'],['Which is a verb?',['happy','jump','blue','book'],1,'Jump is an action.']]},
{id:'adjective',t:'Adjective',u:'صفت',e:'🌸',def:'An adjective tells us more about a noun.',ur:'Adjective اسم کی خوبی یا حالت بتاتی ہے۔',
ex:[['It is a <mark>beautiful</mark> flower.','یہ ایک خوبصورت پھول ہے۔'],['He has a <mark>red</mark> pen.','اس کے پاس سرخ قلم ہے۔'],['The <mark>tall</mark> boy smiled.','لمبا لڑکا مسکرایا۔']],
rule:'An adjective usually comes before the noun it describes.',mis:'✗ a book interesting ✓ an interesting book',
q:[['Find the adjective: "A sweet mango."',['A','sweet','mango','none'],1,'Sweet describes mango.'],['Which is an adjective?',['quick','quickly','run','Ali'],0,'Quick describes a noun.'],['"Three books" — the adjective is…',['Three','books','none','both'],0,'Three tells how many.']]},
{id:'adverb',t:'Adverb',u:'قیدِ فعل',e:'⚡',def:'An adverb tells us how, when, or where an action happens.',ur:'Adverb بتاتا ہے کہ کام کیسے، کب یا کہاں ہوا۔',
ex:[['Children run <mark>quickly</mark>.','بچے تیزی سے دوڑتے ہیں۔'],['She came <mark>yesterday</mark>.','وہ کل آئی تھی۔'],['Sit <mark>here</mark>.','یہاں بیٹھو۔']],
rule:'Many adverbs are made by adding -ly to an adjective (slow → slowly).',mis:'✗ He speaks slow. ✓ He speaks slowly.',
q:[['Find the adverb: "She sings sweetly."',['She','sings','sweetly','none'],2,'Sweetly tells how she sings.'],['He drives ___.',['careful','carefully','care','cares'],1,'Verb needs an adverb.'],['Which is an adverb?',['soon','soft','sun','sit'],0,'Soon tells when.']]},
{id:'preposition',t:'Preposition',u:'حرفِ جار',e:'📍',def:'A preposition shows the relation of a noun to another word, like place or time.',ur:'Preposition اسم کا دوسرے لفظ سے تعلق ظاہر کرتا ہے، جیسے in، on، under۔',
ex:[['The ball is <mark>under</mark> the table.','گیند میز کے نیچے ہے۔'],['The book is <mark>on</mark> the desk.','کتاب ڈیسک پر ہے۔'],['We study <mark>in</mark> school.','ہم اسکول میں پڑھتے ہیں۔']],
rule:'Use at for exact time (at 5), on for days (on Monday), in for months (in May).',mis:'✗ I wake up in 6 o\'clock. ✓ I wake up at 6 o\'clock.',
q:[['The cat is ___ the box. (inside)',['in','on','at','by'],0,'In means inside.'],['School starts ___ Monday.',['in','on','at','under'],1,'Days take on.'],['Find the preposition: "He sat beside me."',['He','sat','beside','me'],2,'Beside shows place.']]},
{id:'conjunction',t:'Conjunction',u:'حرفِ عطف',e:'🔗',def:'A conjunction joins words or sentences.',ur:'Conjunction الفاظ یا جملوں کو آپس میں جوڑتا ہے، جیسے and، but، because۔',
ex:[['Ali <mark>and</mark> Sara are friends.','علی اور سارہ دوست ہیں۔'],['I was tired <mark>but</mark> I studied.','میں تھکا ہوا تھا مگر میں نے پڑھا۔'],['He stayed home <mark>because</mark> it rained.','وہ گھر رہا کیونکہ بارش ہوئی۔']],
rule:'Use but for contrast, because for a reason, or for a choice.',mis:'✗ I like tea but coffee (both). ✓ I like tea and coffee.',
q:[['Find the conjunction: "Tea or coffee?"',['Tea','or','coffee','none'],1,'Or joins two choices.'],['He is poor ___ honest.',['but','because','so','if'],0,'Contrast.'],['Which is a conjunction?',['and','run','big','he'],0,'And joins.']]},
{id:'interjection',t:'Interjection',u:'کلمۂ تعجب',e:'🎉',def:'An interjection shows a sudden feeling like joy, pain, or surprise.',ur:'Interjection اچانک جذبات ظاہر کرتا ہے، جیسے Wow! Oh! Alas!',
ex:[['<mark>Wow</mark>! What a nice day.','واہ! کیا اچھا دن ہے۔'],['<mark>Alas</mark>! He failed.','ہائے افسوس! وہ فیل ہو گیا۔'],['<mark>Hurrah</mark>! We won.','ہرے! ہم جیت گئے۔']],
rule:'An interjection is usually followed by an exclamation mark (!).',mis:'✗ Wow what a goal. ✓ Wow! What a goal!',
q:[['Which is an interjection?',['Hurrah!','quickly','under','and'],0,'Hurrah shows joy.'],['"___! I hurt my hand." (pain)',['Ouch','Hurrah','Wow','And'],0,'Ouch shows pain.'],['Interjections end with…',['!','.',',',';'],0,'Usually an exclamation mark.']]}];
var X=[
{id:'articles',lv:'b',t:'Articles',u:'حروفِ تعریف',e:'🔤',def:'A, an and the are articles. A and an point to any one thing; the points to a particular thing.',ur:'A، an اور the کو articles کہتے ہیں۔ A اور an کوئی بھی ایک چیز بتاتے ہیں، the کوئی خاص چیز۔',ex:[['I have <mark>a</mark> pen.','میرے پاس ایک قلم ہے۔'],['She ate <mark>an</mark> apple.','اس نے ایک سیب کھایا۔'],['<mark>The</mark> sun is hot.','سورج گرم ہے۔']],rule:'Use an before a vowel sound (a, e, i, o, u); use a before other sounds.',mis:'✗ an book ✓ a book',q:[['___ umbrella is useful.',['A','An','Many','Some'],1,'Umbrella starts with a vowel sound, so we use an.'],['I bought ___ orange.',['a','an','two','no'],1,'Orange starts with a vowel sound.']]},
{id:'plural',lv:'b',t:'Singular and Plural',u:'واحد اور جمع',e:'🔢',def:'Singular means one. Plural means more than one.',ur:'Singular ایک کے لیے اور plural ایک سے زیادہ کے لیے ہوتا ہے۔',ex:[['One <mark>book</mark>, two <mark>books</mark>.','ایک کتاب، دو کتابیں۔'],['One <mark>child</mark>, two <mark>children</mark>.','ایک بچہ، دو بچے۔'],['One <mark>box</mark>, two <mark>boxes</mark>.','ایک ڈبہ، دو ڈبے۔']],rule:'Add s to most nouns. Add es after s, x, ch, sh (box → boxes).',mis:'✗ two childs ✓ two children',q:[['Plural of box?',['boxs','boxes','boxen','boxies'],1,'Nouns ending in x take es.'],['Plural of child?',['childs','childes','children','childrens'],2,'Child is irregular: children.']]},
{id:'subject',lv:'b',t:'Subject and Predicate',u:'مبتدا اور خبر',e:'🧩',def:'The subject is who or what the sentence is about. The predicate tells what the subject does or is.',ur:'Subject وہ ہے جس کے بارے میں جملہ ہو۔ Predicate بتاتا ہے کہ subject کیا کرتا ہے یا کیسا ہے۔',ex:[['<mark>Ali</mark> plays cricket.','علی کرکٹ کھیلتا ہے۔'],['The <mark>birds</mark> sing.','پرندے گاتے ہیں۔']],rule:'Every complete sentence needs a subject and a predicate.',mis:'✗ Plays cricket. ✓ Ali plays cricket.',q:[['Subject in: Sara reads a book.',['Sara','reads','book','a'],0,'Sara is who the sentence is about.'],['Predicate in: Birds fly.',['Birds','fly','Birds fly','none'],1,'Fly tells what the birds do.']]},
{id:'common',lv:'b',t:'Common and Proper Nouns',u:'عام اور خاص اسم',e:'🏷️',def:'A common noun names any person, place or thing. A proper noun names one particular person or place and starts with a capital letter.',ur:'Common noun عام نام ہوتا ہے۔ Proper noun کسی خاص کا نام ہوتا ہے اور capital letter سے شروع ہوتا ہے۔',ex:[['I live in <mark>Badin</mark>.','میں بدین میں رہتا ہوں۔'],['A <mark>girl</mark> came.','ایک لڑکی آئی۔']],rule:'Proper nouns always begin with a capital letter.',mis:'✗ pakistan ✓ Pakistan',q:[['Which is a proper noun?',['school','Pangrio','boy','river'],1,'Pangrio is a particular place.'],['Teacher is a ___ noun.',['proper','common','verb','none'],1,'Teacher is a general name.']]},
{id:'present',lv:'i',t:'Present Tense',u:'حال',e:'⏰',def:'Present tense tells about things happening now, habits and facts.',ur:'Present tense اب ہونے والے کام، عادت یا حقیقت بتاتا ہے۔',ex:[['He <mark>plays</mark> football daily.','وہ روز فٹبال کھیلتا ہے۔'],['They <mark>are reading</mark> now.','وہ اب پڑھ رہے ہیں۔']],rule:'In simple present, add s to the verb with he, she, it.',mis:'✗ She go to school. ✓ She goes to school.',q:[['The sun ___ in the east.',['rise','rises','rising','rose'],1,'Sun is singular, so rises.'],['I ___ eating now.',['is','are','am','be'],2,'I goes with am.']]},
{id:'past',lv:'i',t:'Past Tense',u:'ماضی',e:'⏪',def:'Past tense tells about actions that finished earlier.',ur:'Past tense گزرے ہوئے کام کو ظاہر کرتا ہے۔',ex:[['I <mark>went</mark> to school yesterday.','میں کل اسکول گیا۔'],['She <mark>played</mark> well.','اس نے اچھا کھیلا۔']],rule:'Regular verbs add -ed. Irregular verbs change (go → went).',mis:'✗ I goed home. ✓ I went home.',q:[['Past of eat?',['eated','ate','eaten','eats'],1,'Eat is irregular: ate.'],['Yesterday he ___ a letter.',['writes','wrote','write','writing'],1,'Yesterday needs the past form.']]},
{id:'future',lv:'i',t:'Future Tense',u:'مستقبل',e:'⏩',def:'Future tense tells about actions that will happen later.',ur:'Future tense آنے والے وقت کے کام بتاتا ہے۔',ex:[['I <mark>will visit</mark> Karachi.','میں کراچی جاؤں گا۔'],['We <mark>shall win</mark>.','ہم جیتیں گے۔']],rule:'Use will or shall with the base verb.',mis:'✗ I will went. ✓ I will go.',q:[['Tomorrow she ___ come.',['will','did','was','has'],0,'Tomorrow needs will.'],['He will ___ tomorrow.',['plays','play','played','playing'],1,'After will use the base verb.']]},
{id:'degrees',lv:'i',t:'Degrees of Adjectives',u:'صفت کے درجے',e:'📏',def:'Adjectives have three degrees: positive, comparative and superlative.',ur:'Adjective کے تین درجے ہیں: positive، comparative اور superlative۔',ex:[['Sara is <mark>taller</mark> than Ali.','سارہ علی سے لمبی ہے۔'],['Zain is the <mark>tallest</mark> boy.','زین سب سے لمبا لڑکا ہے۔']],rule:'Add -er and -est to short words; use more and most with long words.',mis:'✗ more taller ✓ taller',q:[['Comparative of small?',['smallest','smaller','more small','smalls'],1,'Add -er.'],['Superlative of good?',['better','goodest','best','well'],2,'Good → better → best.']]},
{id:'punct',lv:'i',t:'Punctuation and Capitalization',u:'رموزِ اوقاف',e:'✏️',def:'Begin sentences and names with a capital letter and end them with . ? or !',ur:'جملے اور ناموں کو capital letter سے شروع کریں اور آخر میں . ؟ یا ! لگائیں۔',ex:[['<mark>M</mark>y name is Ali<mark>.</mark>','میرا نام علی ہے۔'],['Where do you live<mark>?</mark>','تم کہاں رہتے ہو؟']],rule:'A question ends with a question mark.',mis:'✗ where is karachi ✓ Where is Karachi?',q:[['Which is correct?',['where is ali','Where is Ali?','where is Ali?','Where is ali.'],1,'Capital letters and a question mark.'],['A question ends with…',['.','?','!',','],1,'Use a question mark.']]},
{id:'voice',lv:'a',t:'Active and Passive Voice',u:'معروف اور مجہول',e:'🔁',def:'In active voice the subject does the action. In passive voice the subject receives the action.',ur:'Active میں کام کرنے والا subject ہوتا ہے۔ Passive میں کام subject پر ہوتا ہے۔',ex:[['Ali <mark>wrote</mark> a letter.','علی نے خط لکھا۔'],['A letter <mark>was written</mark> by Ali.','علی کے ذریعے خط لکھا گیا۔']],rule:'Passive = be verb + past participle (is made, was made).',mis:'✗ The cake made by her. ✓ The cake was made by her.',q:[['Passive of: She cooks rice.',['Rice cooks by her.','Rice is cooked by her.','Rice was cook by her.','Rice cooking by her.'],1,'Is + cooked.'],['Which is passive?',['Ali eats a mango.','The mango is eaten by Ali.','Ali ate.','Ali is eating.'],1,'Subject receives the action.']]},
{id:'speech',lv:'a',t:'Direct and Indirect Speech',u:'راست اور بالواسطہ بیان',e:'💬',def:'Direct speech gives exact words in quotation marks. Indirect speech reports them without quotation marks.',ur:'Direct speech میں اصل الفاظ ہوتے ہیں۔ Indirect speech میں بات اپنے الفاظ میں بیان کی جاتی ہے۔',ex:[['He said, "I am happy."','اس نے کہا، "میں خوش ہوں۔"'],['He said that he <mark>was</mark> happy.','اس نے کہا کہ وہ خوش تھا۔']],rule:'In indirect speech, present tense usually changes to past (am → was).',mis:'✗ He said that I am happy. ✓ He said that he was happy.',q:[['Indirect of: She said, "I am tired."',['She said that she is tired.','She said that she was tired.','She said I tired.','She says tired.'],1,'am → was, I → she.'],['Direct speech uses…',['quotation marks','brackets','nothing','dashes'],0,'Exact words go in quotation marks.']]},
{id:'syn',lv:'a',t:'Synonyms and Antonyms',u:'ہم معنی اور متضاد',e:'🔀',def:'Synonyms have similar meanings. Antonyms have opposite meanings.',ur:'Synonyms ہم معنی الفاظ ہیں۔ Antonyms متضاد الفاظ ہیں۔',ex:[['<mark>big</mark> = large','big کا ہم معنی large ہے۔'],['<mark>hot</mark> ↔ cold','hot کا متضاد cold ہے۔']],rule:'Learn words in pairs to remember them.',mis:'✗ The opposite of happy is glad. ✓ Glad is a synonym; sad is the antonym.',q:[['Antonym of brave?',['bold','coward','strong','kind'],1,'Coward is the opposite.'],['Synonym of begin?',['start','end','stop','finish'],0,'Begin and start mean the same.']]},
{id:'vocab',lv:'a',t:'Vocabulary with Urdu Meanings',u:'ذخیرۂ الفاظ',e:'📚',def:'Learning new words and their meanings makes your English stronger.',ur:'نئے الفاظ کے معنی سیکھنے سے آپ کی انگریزی مضبوط ہوتی ہے۔',ex:[['<mark>honest</mark>','ایماندار'],['<mark>brave</mark>','بہادر'],['<mark>library</mark>','کتب خانہ']],rule:'Use each new word in a sentence.',mis:'✗ brave = ڈرپوک ✓ brave = بہادر',q:[['Urdu meaning of library?',['کتب خانہ','ہسپتال','بازار','باغ'],0,'Library is کتب خانہ.'],['Honest means…',['جھوٹا','ایماندار','سست','تیز'],1,'Honest is ایماندار.']]},
{id:'trans',lv:'a',t:'Urdu-to-English Translation',u:'اردو سے انگریزی ترجمہ',e:'🌐',def:'To translate, find the subject, verb and object, then write them in English order.',ur:'اردو میں فعل آخر میں آتا ہے، مگر انگریزی میں ترتیب Subject + Verb + Object ہوتی ہے۔',ex:[['I <mark>eat</mark> an apple.','میں سیب کھاتا ہوں۔'],['She <mark>reads</mark> a book.','وہ کتاب پڑھتی ہے۔']],rule:'English order: Subject + Verb + Object.',mis:'✗ I an apple eat. ✓ I eat an apple.',q:[['Translate: وہ کرکٹ کھیلتا ہے۔',['He plays cricket.','He cricket plays.','Plays he cricket.','He play cricket.'],0,'Subject + verb + object.'],['Which has the correct order?',['She a letter writes.','She writes a letter.','Writes she a letter.','A letter she writes.'],1,'Subject, verb, object.']]},
{id:'fix',lv:'a',t:'Sentence Correction',u:'جملے کی درستی',e:'🛠️',def:'Find the mistake in a sentence and fix it. Check the verb form, tense, spelling and capital letters.',ur:'جملے کی غلطی تلاش کر کے درست کریں۔ فعل، زمانہ، ہجے اور capital letters دیکھیں۔',ex:[['✗ He <mark>go</mark> to school. ✓ He goes to school.','وہ اسکول جاتا ہے۔'],['✗ They <mark>was</mark> late. ✓ They were late.','وہ دیر سے آئے۔']],rule:'A singular subject takes a singular verb; a plural subject takes a plural verb.',mis:'✗ The boys is playing. ✓ The boys are playing.',q:[['Correct: She don\'t like tea.',["She doesn't like tea.",'She not like tea.','She didn\'t likes tea.','She don\'t likes tea.'],0,'She takes doesn\'t.'],['Which is correct?',['Ali and Sara is friends.','Ali and Sara are friends.','Ali and Sara be friends.','Ali and Sara am friends.'],1,'Two people need are.']]}];

function ill(k){return '<svg viewBox="0 0 300 120" role="img" aria-label="'+k+' picture" style="width:100%;color:var(--tx);margin:8px 0"><rect width="300" height="120" rx="16" style="fill:var(--lg)"/>'+SC[k]+'</svg>'}
var PC=[['boy','The <mark>boy</mark> <mark>reads</mark> a book.','لڑکا کتاب پڑھتا ہے۔','Boy is a noun. Reads is a verb.'],
['noun','The <mark>boy</mark> has a <mark>book</mark> at <mark>school</mark>.','لڑکے کے پاس اسکول میں کتاب ہے۔','Boy, book and school are nouns.'],
['pronoun','Sara is kind. <mark>She</mark> helps us.','سارہ مہربان ہے۔ وہ ہماری مدد کرتی ہے۔','She is a pronoun. It replaces Sara.'],
['verb','The farmer <mark>works</mark> in the field.','کسان کھیت میں کام کرتا ہے۔','Works is an action verb.'],
['adjective','It is a <mark>beautiful</mark> flower.','یہ ایک خوبصورت پھول ہے۔','Beautiful describes the noun flower.'],
['adverb','The children run <mark>quickly</mark>.','بچے تیزی سے دوڑتے ہیں۔','Quickly tells how they run.'],
['preposition','The ball is <mark>under</mark> the table.','گیند میز کے نیچے ہے۔','Under is a preposition of place.'],
['conjunction','I like an apple <mark>and</mark> a banana.','مجھے سیب اور کیلا پسند ہے۔','And joins two nouns.'],
['interjection','<mark>Wow</mark>! We won the match.','واہ! ہم میچ جیت گئے۔','Wow shows surprise and joy.']];
function pics(){nav('home');m.innerHTML=`<button class="back" data-go="home">‹ Home</button><h2 class="pt">Picture Learning</h2>`+PC.map(c=>`<div class="sc">${ill(c[0])}<div class="row"><b>${c[1]}</b>${sb(c[1],'en')}</div><div class="row"><div class="ur" style="flex:1">${c[2]}</div>${sb(c[2],'ur')}</div><p class="note">💡 ${c[3]}</p></div>`).join('')}
var Q=null;
function startQuiz(id){var pool=[];(id=='mix'?A:A.filter(function(a){return a.id==id})).forEach(function(l){l.q.forEach(function(q){pool.push({q:q,l:l.id})})});
 pool.sort(function(){return Math.random()-.5});Q={id:id,qs:pool.slice(0,id=='mix'?10:pool.length),i:0,ok:0,bad:[]};qz()}
function qz(){nav('practice');if(Q.i>=Q.qs.length)return result();var x=Q.qs[Q.i].q;m.innerHTML=`<div class="qt"><button class="x" data-go="practice" aria-label="Close">✕</button><div class="bar big"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><b>${Q.ok*10}⭐</b></div><p class="qn">Question ${Q.i+1} of ${Q.qs.length}</p><div class="qc">${x[0]}</div>${x[1].map((o,k)=>`<button class="opt" data-o="${k}"><i>${'ABCD'[k]}</i><span dir="auto">${o}</span></button>`).join('')}<div id="fb"></div>`}
function ans(k){if(Q.done)return;Q.done=1;var x=Q.qs[Q.i].q,bs=document.querySelectorAll('.opt'),good=k==x[2];bs[x[2]].classList.add('ok');if(!good){bs[k].classList.add('no');Q.bad.push(Q.qs[Q.i])}else Q.ok++;$('fb').innerHTML=`<div class="fb ${good?'g':'b'}"><b>${good?'🎉 Correct! +10 points':'❌ Not quite'}</b><p>${x[3]}</p></div><button class="btn" data-next="1">${Q.i+1<Q.qs.length?'Next question ›':'See results'}</button>`;$('fb').scrollIntoView({behavior:'smooth',block:'end'})}
function result(){var sc=Math.round(Q.ok/Q.qs.length*100),t=new Date().toDateString();S.pts+=Q.ok*10;S.best=Math.max(S.best,sc);S.res[Q.id]=Math.max(S.res[Q.id]||0,sc);if(Q.id!='mix'&&sc>=60&&!S.done.includes(Q.id))S.done.push(Q.id);if(S.last!=t){var y=new Date(Date.now()-864e5).toDateString();S.streak=S.last==y?S.streak+1:1;S.last=t}save();var n=sc>=90?3:sc>=60?2:sc>0?1:0;m.innerHTML=`<div class="res">${ring(sc,120)}<h2>${sc>=60?'Well done!':'Keep practising!'}</h2><div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div><p><b>Score: ${sc} / 100</b><br>${Q.ok} of ${Q.qs.length} correct · +${Q.ok*10} points</p></div>${Q.bad.length?'<h3>Review mistakes</h3>'+Q.bad.map(b=>`<div class="sc"><b>${b.q[0]}</b><p>✔ ${b.q[1][b.q[2]]}</p><p class="note">${b.q[3]}</p></div>`).join(''):''}<button class="btn" data-quiz="${Q.id}">Retry quiz</button><button class="btn alt" data-go="home">Home</button>`}
function ach(){var d=id=>S.done.includes(id);return [['🌱','First Lesson',S.done.length>0],['📗','Grammar Beginner',X.filter(l=>l.lv=='b').every(l=>d(l.id))],['🏷️','Noun Master',(S.res.noun||0)>=100],['🏆','Quiz Champion',S.best>=100],['🔥','7-Day Streak',S.streak>=7],['🎓','Grammar Expert',L.every(l=>d(l.id))]]}
function progress(){nav('progress');var a=ach();m.innerHTML=`<h2 class="pt">My Progress</h2><div class="res">${ring(pct(),120)}<p><b>${S.done.length} of ${A.length} lessons completed</b></p><p class="note">⭐ ${S.pts} points · 🏅 Best ${S.best}/100 · 🔥 ${S.streak}-day streak</p></div><h3>Achievements (${a.filter(x=>x[2]).length}/6)</h3><div class="bds">${a.map(x=>`<div class="bd ${x[2]?'on':''}"><div>${x[2]?x[0]:'🔒'}</div>${x[1]}</div>`).join('')}</div>`}
function profile(){nav('profile');var v=window.speechSynthesis?speechSynthesis.getVoices():[],u=v.some(a=>a.lang.toLowerCase().startsWith('ur'));m.innerHTML=`<div class="res"><img class="crest" style="width:96px;height:96px;margin:auto;display:block" src="${CR}" alt="School crest"><h2>Grammar Dost</h2><p>Learn English Grammar with Urdu Support.</p><p class="note">An educational app to help Grade 8 students improve their English grammar through bilingual explanations, illustrations, quizzes and audio learning.</p><p class="ur">گورنمينٽ ھائير سيڪنڈری اسڪول پنگريو</p><p class="ur">Designed By: عبداللہ شھاب جونیجو</p></div><div class="sc"><label>NICKNAME (optional)</label><input id="nk" maxlength="20" value="${(S.nick||'').replace(/[<>&]/g,'').replace(/[\x22]/g,'')}" placeholder="Your nickname"></div><div class="sc"><label>SPEECH SPEED</label><div class="row"><button class="btn alt" data-sp="0.7">Slow</button><button class="btn alt" data-sp="1">Normal</button></div><p class="msg">${u?'Urdu voice found on this device.':'No Urdu voice found on this device. Urdu audio will not play; read the Urdu text instead. English audio still works.'}</p></div><p class="msg">Progress is saved on this browser and device only. It does not sync between devices.</p><button class="btn alt" data-reset="1">Reset progress</button><p class="ft ur">گورنمينٽ ھائير سيڪنڈری اسڪول پنگريو | Designed by عبداللہ شھاب جونیجو</p>`}
document.addEventListener('click',e=>{var t=e.target.closest('button');if(!t)return;var d=t.dataset;
if(d.s)say(decodeURIComponent(d.s),d.l);else if(d.tab){TB=d.tab;lessons()}else if(d.go)window[d.go]();else if(d.lesson)lesson(d.lesson);else if(d.quiz)startQuiz(d.quiz);
else if(d.o!==undefined)ans(+d.o);else if(d.next){Q.i++;Q.done=0;qz()}else if(d.sp){sp=+d.sp;alert('Speed set.')}
else if(d.reset&&confirm('Erase all progress on this device?')){S={done:[],pts:0,best:0,streak:0,last:'',res:{}};save();profile()}});
